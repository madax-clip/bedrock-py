name: Stale

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this issue is still relevant, please comment or add the `pinned` label.
          close-issue-message: >
            This issue was closed because it has been stale for 14 days with no activity.

          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            If this PR is still relevant, please comment or add the `pinned` label.
          close-pr-message: >
            This pull request was closed because it has been stale for 7 days with no activity.

          # Exemptions
          exempt-issue-labels: pinned,security,bug
          exempt-pr-labels: pinned,security

          # Settings
          operations-per-run: 100
          remove-stale-when-updated: true
