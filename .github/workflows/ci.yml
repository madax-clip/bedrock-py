name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      bedrock: ${{ steps.filter.outputs.bedrock }}
      bedrock_cli: ${{ steps.filter.outputs.bedrock_cli }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            docs:
              - 'docs-web/**'
            bedrock:
              - 'packages/bedrock/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            bedrock_cli:
              - 'packages/bedrock-cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Decision: CI fails on any known vulnerability in the locked runtime
      # dependency set. An exception requires a documented
      # `--ignore-vuln <ID>` here plus a note in SECURITY.md explaining why
      # the advisory does not apply.
      - name: pip-audit locked runtime dependencies
        run: |
          uv export --locked --all-packages --no-dev --no-emit-project \
            | grep -vE '^\s*(#|$)' | grep -vE '^-e \./' > /tmp/ci-reqs.txt
          uvx pip-audit --disable-pip -r /tmp/ci-reqs.txt

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: docs-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: docs-web

      - name: Run ESLint
        run: pnpm run lint
        working-directory: docs-web

  test-bedrock:
    name: Test (bedrock-core / Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bedrock == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --package bedrock-core --locked

      - name: Run tests
        run: uv run --package bedrock-core pytest packages/bedrock/tests/ -v --tb=short

  test-bedrock-cli:
    name: Test (bedrock-cli / Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bedrock_cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --package bedrock-cli --locked

      - name: Run tests
        run: uv run --package bedrock-cli pytest packages/bedrock-cli/tests/ -v --tb=short

  build-bedrock:
    name: Build (bedrock-core)
    runs-on: ubuntu-latest
    needs: [changes, lint-python, test-bedrock]
    if: needs.changes.outputs.bedrock == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Build package
        run: uv build --package bedrock-core

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-bedrock-core
          path: dist/

  build-bedrock-cli:
    name: Build (bedrock-cli)
    runs-on: ubuntu-latest
    needs: [changes, lint-python, test-bedrock-cli]
    if: needs.changes.outputs.bedrock_cli == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Build package
        run: uv build --package bedrock-cli

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-bedrock-cli
          path: dist/
