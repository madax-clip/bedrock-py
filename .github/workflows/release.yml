name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    name: Validate tag, versions, and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Tag matches both package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('bedrock-core'))")
          CLI_VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('bedrock-cli'))")
          echo "tag=$TAG_VERSION core=$CORE_VERSION cli=$CLI_VERSION"
          if [ "$TAG_VERSION" != "$CORE_VERSION" ] || [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) must match bedrock-core ($CORE_VERSION) and bedrock-cli ($CLI_VERSION)"
            exit 1
          fi

      - name: Release notes are present and non-empty
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # scripts/extract_release_notes.py handles a section that runs to
          # EOF (the old sed extraction dropped its final line and could
          # fail a valid one-line release as empty). It exits non-zero when
          # the section is missing or blank.
          python scripts/extract_release_notes.py CHANGELOG.md "$VERSION" > release_notes.md
          cat release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

  build:
    name: Build both distributions
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build packages
        run: uv build --all-packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: Fresh-wheel smoke (install, import, CLIs, scaffold)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install the downloaded wheels into a clean environment
        run: |
          # Install the exact wheel files produced by the build job. Passing
          # explicit paths (not bare names) means the step fails if either
          # downloaded artifact is missing, and the packages under test are
          # guaranteed to be the built wheels. Third-party dependencies may
          # still resolve from the registry.
          CORE_WHEEL=$(ls dist/bedrock_core-*.whl)
          CLI_WHEEL=$(ls dist/bedrock_cli-*.whl)
          echo "core wheel: $CORE_WHEEL"
          echo "cli wheel:  $CLI_WHEEL"
          test -f "$CORE_WHEEL" || { echo "::error::bedrock-core wheel missing from downloaded artifacts"; exit 1; }
          test -f "$CLI_WHEEL" || { echo "::error::bedrock-cli wheel missing from downloaded artifacts"; exit 1; }
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python --find-links dist "$CORE_WHEEL" "$CLI_WHEEL"
          # Assert the installed distributions are exactly the downloaded wheels.
          CORE_WHEEL_VERSION=$(basename "$CORE_WHEEL" | cut -d- -f2)
          CLI_WHEEL_VERSION=$(basename "$CLI_WHEEL" | cut -d- -f2)
          CORE_INSTALLED=$(.smoke-venv/bin/python -c "import importlib.metadata; print(importlib.metadata.version('bedrock-core'))")
          CLI_INSTALLED=$(.smoke-venv/bin/python -c "import importlib.metadata; print(importlib.metadata.version('bedrock-cli'))")
          echo "installed bedrock-core==$CORE_INSTALLED (wheel $CORE_WHEEL_VERSION), bedrock-cli==$CLI_INSTALLED (wheel $CLI_WHEEL_VERSION)"
          if [ "$CORE_INSTALLED" != "$CORE_WHEEL_VERSION" ] || [ "$CLI_INSTALLED" != "$CLI_WHEEL_VERSION" ]; then
            echo "::error::Installed distribution versions do not match the downloaded wheels"
            exit 1
          fi

      - name: Smoke import and CLI entry points
        run: |
          .smoke-venv/bin/python -c "import bedrock"
          .smoke-venv/bin/bedrock --help > /dev/null
          .smoke-venv/bin/bedrock --version
          .smoke-venv/bin/bedrock-cli --help > /dev/null
          .smoke-venv/bin/bedrock-cli --version

      - name: Smoke scaffold resolves and installs bedrock-core
        run: |
          DIST_DIR="$PWD/dist"
          CORE_WHEEL=$(ls dist/bedrock_core-*.whl)
          CORE_WHEEL_VERSION=$(basename "$CORE_WHEEL" | cut -d- -f2)
          .smoke-venv/bin/bedrock-cli init smoke-app -o /tmp/smoke
          grep -q '"bedrock-core>=0.2.0"' /tmp/smoke/smoke-app/pyproject.toml
          cd /tmp/smoke/smoke-app
          uv venv .app-venv
          # Seed the app venv with the freshly built core wheel so the
          # scaffold's declared bedrock-core dependency is satisfied by the
          # artifact under test, never by a registry release.
          uv pip install --python .app-venv/bin/python "$DIST_DIR/$(basename "$CORE_WHEEL")"
          # Install the generated project itself. Its declared bedrock-core
          # dependency must resolve against the freshly built core wheel
          # (third-party deps may still come from the registry), so a
          # scaffold dependency that does not actually resolve fails here.
          uv pip install --python .app-venv/bin/python --find-links "$DIST_DIR" .
          .app-venv/bin/python -c "import bedrock"
          APP_CORE_INSTALLED=$(.app-venv/bin/python -c "import importlib.metadata; print(importlib.metadata.version('bedrock-core'))")
          echo "scaffold venv bedrock-core==$APP_CORE_INSTALLED (wheel $CORE_WHEEL_VERSION)"
          if [ "$APP_CORE_INSTALLED" != "$CORE_WHEEL_VERSION" ]; then
            echo "::error::Scaffolded project did not resolve the freshly built bedrock-core wheel"
            exit 1
          fi

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Decision: the release fails on any known vulnerability in the locked
      # runtime dependency set. An exception requires a documented
      # `--ignore-vuln <ID>` here plus a note in SECURITY.md explaining why
      # the advisory does not apply.
      - name: pip-audit locked runtime dependencies
        run: |
          uv export --locked --all-packages --no-dev --no-emit-project \
            | grep -vE '^\s*(#|$)' | grep -vE '^-e \./' > /tmp/release-reqs.txt
          uvx pip-audit --disable-pip -r /tmp/release-reqs.txt

  publish-pypi:
    name: Publish both packages to PyPI
    runs-on: ubuntu-latest
    needs: [build, smoke, dependency-scan]
    environment:
      name: pypi
      url: https://pypi.org/project/bedrock-core/
    permissions:
      id-token: write # Required for trusted publishing (configure for bedrock-core and bedrock-cli)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release with both distributions
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
