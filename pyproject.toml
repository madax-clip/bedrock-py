[project]
name = "bedrock-mono"
version = "0.2.1"
description = "Bedrock monorepo workspace coordinator"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "pre-commit>=4.6.0",
]
docs = [
    "mkdocstrings[python]>=0.26.0",
    "griffe>=1.0.0",
    "pymdown-extensions>=11.0.0",
]

[tool.uv.sources]
bedrock-core = { workspace = true }
bedrock-cli = { workspace = true }


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "F403",
    "F405",
    "E731",
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 60
